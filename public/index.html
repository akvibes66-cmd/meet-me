<script>
  /* =========================================================
     MEETME BY PELQ — RESILIENT SUPABASE FRONTEND
     ========================================================= */

  const SUPABASE_URL = 'https://exeqybodcbletjcdhjfw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_AnnyR-3yXPKHObVLYq0eIA_V5RUV8kg';

  const APP_URL = 'https://playful-cobbler-95dd76.netlify.app';

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth: {
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true
      }
    }
  );

  /* =========================================================
     STATE
     ========================================================= */

  let currentFilter = 'All';
  let searchQuery = '';
  let currentUser = null;

  let authCooldownUntil = 0;
  let renderSequence = 0;
  let isSigningIn = false;

  /* =========================================================
     DOM HELPERS
     ========================================================= */

  function $(id) {
    return document.getElementById(id);
  }

  function setButtonLoading(button, loading, loadingText, normalText) {
    if (!button) return;

    button.disabled = loading;
    button.innerText = loading ? loadingText : normalText;
  }

  function showStatus(message, type = 'info') {
    let status = $('appStatus');

    if (!status) {
      status = document.createElement('div');
      status.id = 'appStatus';

      Object.assign(status.style, {
        position: 'fixed',
        left: '50%',
        bottom: '24px',
        transform: 'translateX(-50%)',
        width: 'min(92vw, 520px)',
        padding: '14px 18px',
        borderRadius: '12px',
        background: '#ffffff',
        color: '#0F1A14',
        border: '1px solid #E8E3DA',
        boxShadow: '0 12px 28px rgba(15,26,20,.15)',
        zIndex: '9999',
        fontSize: '14px',
        fontWeight: '600',
        textAlign: 'center',
        transition: 'opacity .25s ease',
        opacity: '0',
        pointerEvents: 'none'
      });

      document.body.appendChild(status);
    }

    status.innerText = message;
    status.style.opacity = '1';

    if (type === 'error') {
      status.style.borderColor = '#D9383A';
    } else if (type === 'success') {
      status.style.borderColor = '#1A7A4A';
    } else {
      status.style.borderColor = '#E8E3DA';
    }

    clearTimeout(status._hideTimer);

    status._hideTimer = setTimeout(() => {
      status.style.opacity = '0';
    }, 5000);
  }

  function setAuthFormMessage(message = '') {
    let box = $('authMessage');

    if (!box) {
      const form = $('authForm');
      if (!form) return;

      box = document.createElement('div');
      box.id = 'authMessage';

      Object.assign(box.style, {
        marginBottom: '14px',
        padding: '10px 12px',
        borderRadius: '10px',
        fontSize: '13px',
        display: 'none'
      });

      form.insertBefore(box, form.firstChild);
    }

    if (!message) {
      box.style.display = 'none';
      box.innerText = '';
      return;
    }

    box.style.display = 'block';
    box.innerText = message;
  }

  /* =========================================================
     SAFE HTML
     ========================================================= */

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
  }

  function escapeAttribute(value) {
    return escapeHTML(value);
  }

  /* =========================================================
     ERROR HELPERS
     ========================================================= */

  function getErrorMessage(error) {
    if (!error) return '';

    return String(
      error.message ||
      error.error_description ||
      error.details ||
      error.hint ||
      ''
    ).toLowerCase();
  }

  function isAuthError(error) {
    if (!error) return false;

    const message = getErrorMessage(error);

    return (
      error.status === 401 ||
      error.status === 403 ||
      message.includes('jwt') ||
      message.includes('token') ||
      message.includes('session') ||
      message.includes('unauthorized') ||
      message.includes('invalid refresh token')
    );
  }

  function isRateLimitError(error) {
    if (!error) return false;

    const message = getErrorMessage(error);

    return (
      error.status === 429 ||
      message.includes('rate limit') ||
      message.includes('too many') ||
      message.includes('60 seconds') ||
      message.includes('security') ||
      message.includes('email rate')
    );
  }

  function userFriendlyAuthError(error) {
    if (!error) {
      return 'We could not complete sign-in right now. Please try again.';
    }

    if (isRateLimitError(error)) {
      return 'Please wait a little before requesting another login link.';
    }

    const message = getErrorMessage(error);

    if (
      message.includes('smtp') ||
      message.includes('sending') ||
      message.includes('email') ||
      message.includes('mailer')
    ) {
      return 'We could not send the login email right now. Please try again shortly.';
    }

    if (
      message.includes('redirect') ||
      message.includes('url') ||
      message.includes('redirect_to')
    ) {
      return 'The login destination is not configured correctly yet.';
    }

    return 'We could not sign you in right now. Please try again.';
  }

  /* =========================================================
     SESSION MANAGEMENT
     ========================================================= */

  async function safelyClearSession() {
    try {
      await supabaseClient.auth.signOut({ scope: 'local' });
    } catch (error) {
      console.warn('Local session cleanup failed:', error);
    }

    currentUser = null;
    updateAuthUI();
  }

  async function refreshSessionSafely() {
    try {
      const { data, error } = await supabaseClient.auth.getSession();

      if (error) {
        console.warn('Could not load session:', error);
        currentUser = null;
        updateAuthUI();
        return null;
      }

      currentUser = data?.session?.user || null;
      updateAuthUI();

      return data?.session || null;
    } catch (error) {
      console.warn('Session initialization failed:', error);
      currentUser = null;
      updateAuthUI();
      return null;
    }
  }

  /* =========================================================
     AUTH STATE
     ========================================================= */

  supabaseClient.auth.onAuthStateChange((event, session) => {
    currentUser = session?.user || null;

    updateAuthUI();

    /*
      Don't blindly render multiple times during auth events.
      One deferred render is enough.
    */
    setTimeout(() => {
      renderGrid();
    }, 0);
  });

  function updateAuthUI() {
    const authBtn = $('authNavBtn');

    if (!authBtn) return;

    authBtn.disabled = false;

    if (currentUser) {
      authBtn.innerText = 'Sign Out';

      authBtn.onclick = async () => {
        authBtn.disabled = true;
        authBtn.innerText = 'Signing Out...';

        try {
          await supabaseClient.auth.signOut({ scope: 'local' });
          currentUser = null;
          updateAuthUI();
          renderGrid();
          showStatus('You have been signed out.', 'success');
        } catch (error) {
          console.warn('Sign out failed:', error);

          /*
            Even when remote sign-out fails, clear the browser
            session so the UI does not get stuck.
          */
          await safelyClearSession();

          renderGrid();
          showStatus('You have been signed out on this device.', 'success');
        }
      };
    } else {
      authBtn.innerText = 'Sign In';
      authBtn.onclick = openAuthModal;
    }
  }

  /* =========================================================
     AUTH MODAL
     ========================================================= */

  function openAuthModal() {
    const modal = $('authModal');

    if (!modal) return;

    setAuthFormMessage('');
    modal.classList.add('active');

    setTimeout(() => {
      $('authEmail')?.focus();
    }, 100);
  }

  function closeAuthModal() {
    const modal = $('authModal');
    const form = $('authForm');

    if (modal) modal.classList.remove('active');
    if (form) form.reset();

    setAuthFormMessage('');
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();

    if (isSigningIn) return;

    const emailInput = $('authEmail');
    const button = $('authSubmitBtn');

    if (!emailInput || !button) return;

    const email = emailInput.value.trim().toLowerCase();

    setAuthFormMessage('');

    if (!email) {
      setAuthFormMessage('Please enter your email address.');
      emailInput.focus();
      return;
    }

    /*
      Browser-side validation.
      Supabase performs its own validation too.
    */
    const emailLooksValid =
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    if (!emailLooksValid) {
      setAuthFormMessage('Please enter a valid email address.');
      emailInput.focus();
      return;
    }

    const now = Date.now();

    if (now < authCooldownUntil) {
      const secondsRemaining = Math.ceil(
        (authCooldownUntil - now) / 1000
      );

      setAuthFormMessage(
        `Please wait ${secondsRemaining} second${secondsRemaining === 1 ? '' : 's'} before requesting another link.`
      );

      return;
    }

    isSigningIn = true;

    setAuthFormMessage(
      'Sending your secure login link...'
    );

    setButtonLoading(
      button,
      true,
      'Sending link...',
      'Send Magic Link'
    );

    try {
      const { error } = await supabaseClient.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: APP_URL,
          shouldCreateUser: true
        }
      });

      if (error) {
        console.error('Magic link request failed:', error);

        if (isRateLimitError(error)) {
          authCooldownUntil = Date.now() + 60000;

          setAuthFormMessage(
            'A login email was requested recently. Please wait about 60 seconds before trying again.'
          );

          return;
        }

        if (isAuthError(error)) {
          setAuthFormMessage(
            'Your session needs to be refreshed. Please close this window and try again.'
          );

          return;
        }

        setAuthFormMessage(
          userFriendlyAuthError(error)
        );

        return;
      }

      /*
        Supabase documents a default 60-second per-user
        window for OTP/magic-link requests.
      */
      authCooldownUntil = Date.now() + 60000;

      setAuthFormMessage(
        'Login link sent. Check your inbox and spam folder.'
      );

      showStatus(
        'Check your email for your Meetme login link.',
        'success'
      );

      setTimeout(() => {
        closeAuthModal();
      }, 1800);

    } catch (error) {
      console.error('Unexpected sign-in failure:', error);

      setAuthFormMessage(
        'Something interrupted the login request. Please try again shortly.'
      );

    } finally {
      isSigningIn = false;

      setButtonLoading(
        button,
        false,
        'Sending link...',
        'Send Magic Link'
      );
    }
  }

  /* =========================================================
     SEARCH
     ========================================================= */

  function sanitizeSearchInput(value) {
    return String(value || '')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 100);
  }

  function handleSearch() {
    searchQuery = sanitizeSearchInput(
      $('searchInput')?.value || ''
    );

    renderGrid();
  }

  /*
    Prevent search text from accidentally becoming malformed
    PostgREST filter syntax.
  */
  function escapePostgrestSearch(value) {
    return String(value || '')
      .replace(/\\/g, '\\\\')
      .replace(/%/g, '\\%')
      .replace(/_/g, '\\_')
      .replace(/,/g, '\\,')
      .replace(/\./g, '\\.')
      .replace(/\(/g, '\\(')
      .replace(/\)/g, '\\)')
      .replace(/:/g, '\\:');
  }

  /* =========================================================
     FETCH SKILLS
     ========================================================= */

  async function fetchSkills() {
    try {
      let query = supabaseClient
        .from('skills')
        .select(
          'id, name, meta, category, title, description, price, user_id, created_at, image_url'
        )
        .order('created_at', {
          ascending: false
        })
        .limit(100);

      if (currentFilter !== 'All') {
        query = query.eq(
          'category',
          currentFilter
        );
      }

      if (searchQuery.length > 0) {
        const safeSearch =
          escapePostgrestSearch(searchQuery);

        query = query.or(
          [
            `title.ilike.%${safeSearch}%`,
            `description.ilike.%${safeSearch}%`,
            `meta.ilike.%${safeSearch}%`,
            `name.ilike.%${safeSearch}%`
          ].join(',')
        );
      }

      const { data, error } = await query;

      if (error) {
        console.error('Error loading skills:', error);

        if (isAuthError(error)) {
          await safelyClearSession();

          /*
            Retry exactly once as a guest.
          */
          return await fetchSkillsAsGuest();
        }

        showStatus(
          'Listings are temporarily unavailable. Please try again.',
          'error'
        );

        return [];
      }

      return Array.isArray(data) ? data : [];

    } catch (error) {
      console.error('Unexpected skills fetch error:', error);

      showStatus(
        'We could not load listings right now.',
        'error'
      );

      return [];
    }
  }

  async function fetchSkillsAsGuest() {
    try {
      let query = supabaseClient
        .from('skills')
        .select(
          'id, name, meta, category, title, description, price, user_id, created_at, image_url'
        )
        .order('created_at', {
          ascending: false
        })
        .limit(100);

      if (currentFilter !== 'All') {
        query = query.eq(
          'category',
          currentFilter
        );
      }

      if (searchQuery.length > 0) {
        const safeSearch =
          escapePostgrestSearch(searchQuery);

        query = query.or(
          [
            `title.ilike.%${safeSearch}%`,
            `description.ilike.%${safeSearch}%`,
            `meta.ilike.%${safeSearch}%`,
            `name.ilike.%${safeSearch}%`
          ].join(',')
        );
      }

      const { data, error } = await query;

      if (error) {
        console.error(
          'Guest skills fetch failed:',
          error
        );

        return [];
      }

      return Array.isArray(data) ? data : [];

    } catch (error) {
      console.error(
        'Unexpected guest fetch error:',
        error
      );

      return [];
    }
  }

  /* =========================================================
     RENDER GRID
     ========================================================= */

  async function renderGrid() {
    const grid = $('cardGrid');

    if (!grid) return;

    const thisRender = ++renderSequence;

    grid.innerHTML = `
      <div class="empty-state">
        Loading live listings...
      </div>
    `;

    const skills = await fetchSkills();

    /*
      A newer render may have started while this request
      was running. Do not overwrite its result.
    */
    if (thisRender !== renderSequence) {
      return;
    }

    grid.innerHTML = '';

    if (!skills.length) {
      grid.innerHTML = `
        <div class="empty-state">
          No skill listings match your query.
        </div>
      `;
      return;
    }

    const fragment = document.createDocumentFragment();

    skills.forEach(skill => {
      const initial =
        skill.name
          ? String(skill.name).charAt(0).toUpperCase()
          : '?';

      const isOwner =
        Boolean(currentUser) &&
        currentUser.id === skill.user_id;

      const card =
        document.createElement('article');

      card.className = 'skill-card';

      /*
        We construct most card content without trusting raw
        HTML from the database.
      */
      const header = document.createElement('div');
      header.className = 'card-header';

      const avatar =
        document.createElement('div');

      avatar.className = 'avatar';
      avatar.innerText = initial;

      const peerInfo =
        document.createElement('div');

      peerInfo.className = 'peer-info';

      const name =
        document.createElement('div');

      name.className = 'name';
      name.innerText = skill.name || 'Anonymous';

      const meta =
        document.createElement('div');

      meta.className = 'meta';
      meta.innerText = skill.meta || '';

      peerInfo.appendChild(name);
      peerInfo.appendChild(meta);

      header.appendChild(avatar);
      header.appendChild(peerInfo);

      const content =
        document.createElement('div');

      content.appendChild(header);

      if (skill.image_url) {
        const image =
          document.createElement('img');

        image.src = String(skill.image_url);
        image.alt = 'Skill preview';
        image.loading = 'lazy';
        image.decoding = 'async';

        Object.assign(image.style, {
          width: '100%',
          height: '180px',
          objectFit: 'cover',
          borderRadius: 'var(--radius-sm)',
          marginBottom: '12px'
        });

        image.onerror = () => {
          image.remove();
        };

        content.appendChild(image);
      }

      const title =
        document.createElement('h2');

      title.className = 'skill-title';
      title.innerText = skill.title || 'Untitled skill';

      const description =
        document.createElement('p');

      description.className = 'skill-desc';
      description.innerText =
        skill.description || '';

      content.appendChild(title);
      content.appendChild(description);

      const footer =
        document.createElement('div');

      footer.className = 'card-footer';

      const price =
        document.createElement('span');

      price.className = 'price-tag';
      price.innerText = skill.price || '';

      const actions =
        document.createElement('div');

      if (isOwner) {
        const deleteButton =
          document.createElement('button');

        deleteButton.className =
          'btn-secondary';

        deleteButton.innerText = 'Delete';

        Object.assign(deleteButton.style, {
          marginRight: '8px',
          color: 'var(--color-error)',
          borderColor: 'var(--color-error)'
        });

        deleteButton.onclick = () =>
          deleteListing(skill.id);

        actions.appendChild(deleteButton);
      }

      const messageButton =
        document.createElement('button');

      messageButton.className = 'btn-primary';

      const firstName =
        String(skill.name || '')
          .trim()
          .split(/\s+/)[0] || 'Creator';

      messageButton.innerText =
        `Message ${firstName}`;

      messageButton.onclick = () =>
        openContactModal(
          skill.id,
          skill.name || 'Creator'
        );

      actions.appendChild(messageButton);

      footer.appendChild(price);
      footer.appendChild(actions);

      card.appendChild(content);
      card.appendChild(footer);

      fragment.appendChild(card);
    });

    grid.appendChild(fragment);
  }

  /* =========================================================
     DELETE LISTING
     ========================================================= */

  async function deleteListing(skillId) {
    if (!currentUser) {
      showStatus(
        'Please sign in to manage your listings.',
        'error'
      );

      openAuthModal();
      return;
    }

    if (!skillId) {
      showStatus(
        'This listing could not be identified.',
        'error'
      );
      return;
    }

    const confirmed =
      window.confirm(
        'Are you sure you want to delete this listing?'
      );

    if (!confirmed) return;

    try {
      const { error } =
        await supabaseClient
          .from('skills')
          .delete()
          .eq('id', skillId);

      if (error) {
        console.error(
          'Delete listing failed:',
          error
        );

        if (isAuthError(error)) {
          await safelyClearSession();

          showStatus(
            'Your session expired. Please sign in again.',
            'error'
          );

          openAuthModal();
          return;
        }

        showStatus(
          'We could not delete that listing. Please try again.',
          'error'
        );

        return;
      }

      showStatus(
        'Listing deleted successfully.',
        'success'
      );

      await renderGrid();

    } catch (error) {
      console.error(
        'Unexpected delete error:',
        error
      );

      showStatus(
        'We could not delete that listing right now.',
        'error'
      );
    }
  }

  /* =========================================================
     POST MODAL
     ========================================================= */

  function openPostModal() {
    if (!currentUser) {
      showStatus(
        'Sign in first to post a skill.',
        'info'
      );

      openAuthModal();
      return;
    }

    $('postModal')?.classList.add('active');
  }

  function closePostModal() {
    $('postModal')?.classList.remove('active');
    $('skillForm')?.reset();

    document
      .querySelectorAll('#skillForm .has-error')
      .forEach(element => {
        element.classList.remove('has-error');
      });
  }

  /* =========================================================
     SKILL SUBMISSION
     ========================================================= */

  function validateSkillForm() {
    const fields = {
      name: {
        id: 'fullName',
        group: 'group-name',
        validate: value =>
          value.trim().length > 0
      },

      meta: {
        id: 'collegeMeta',
        group: 'group-meta',
        validate: value =>
          value.trim().length > 0
      },

      category: {
        id: 'category',
        group: 'group-category',
        validate: value =>
          value !== ''
      },

      title: {
        id: 'skillTitle',
        group: 'group-title',
        validate: value =>
          value.trim().length > 0 &&
          value.trim().length <= 60
      },

      description: {
        id: 'skillDesc',
        group: 'group-desc',
        validate: value =>
          value.trim().length > 0 &&
          value.trim().length <= 160
      },

      price: {
        id: 'price',
        group: 'group-price',
        validate: value =>
          value.trim().length > 0
      },

      phone: {
        id: 'phone',
        group: 'group-phone',
        validate: value => {
          const digits =
            value.replace(/\D/g, '');

          return (
            digits.length >= 7 &&
            digits.length <= 15
          );
        }
      }
    };

    let valid = true;
    const result = {};

    Object.entries(fields).forEach(([key, field]) => {
      const input = $(field.id);
      const group = $(field.group);

      if (!input || !group) {
        valid = false;
        return;
      }

      const value = input.value;

      if (!field.validate(value)) {
        group.classList.add('has-error');
        valid = false;
      } else {
        group.classList.remove('has-error');

        result[key] = value.trim();
      }
    });

    return {
      valid,
      data: result
    };
  }

  async function handleSkillSubmit(e) {
    e.preventDefault();

    if (!currentUser) {
      showStatus(
        'Your session has ended. Please sign in again.',
        'error'
      );

      closePostModal();
      openAuthModal();
      return;
    }

    const validation =
      validateSkillForm();

    const imageInput =
      $('skillImage');

    const imageFile =
      imageInput?.files?.[0] || null;

    if (imageFile) {
      const allowedTypes = [
        'image/jpeg',
        'image/png',
        'image/webp'
      ];

      if (!allowedTypes.includes(imageFile.type)) {
        $('group-image')?.classList.add(
          'has-error'
        );

        showStatus(
          'Please use a JPEG, PNG, or WEBP image.',
          'error'
        );

        return;
      }

      if (imageFile.size > 3 * 1024 * 1024) {
        $('group-image')?.classList.add(
          'has-error'
        );

        showStatus(
          'Images must be 3MB or smaller.',
          'error'
        );

        return;
      }

      $('group-image')?.classList.remove(
        'has-error'
      );
    }

    if (!validation.valid) {
      showStatus(
        'Please correct the highlighted fields.',
        'error'
      );

      return;
    }

    const submitButton =
      $('submitBtn');

    setButtonLoading(
      submitButton,
      true,
      'Publishing...',
      'Publish Skill Listing'
    );

    let uploadedFilePath = null;

    try {
      let publicImageUrl = null;

      /*
        Upload image first, if supplied.
      */
      if (imageFile) {
        const extension =
          imageFile.type === 'image/jpeg'
            ? 'jpg'
            : imageFile.type === 'image/png'
              ? 'png'
              : 'webp';

        uploadedFilePath =
          `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

        const {
          error: uploadError
        } = await supabaseClient.storage
          .from('skill-images')
          .upload(
            uploadedFilePath,
            imageFile,
            {
              cacheControl: '3600',
              contentType: imageFile.type,
              upsert: false
            }
          );

        if (uploadError) {
          console.error(
            'Image upload failed:',
            uploadError
          );

          if (isAuthError(uploadError)) {
            await safelyClearSession();

            showStatus(
              'Your session expired. Please sign in again.',
              'error'
            );

            closePostModal();
            openAuthModal();

            return;
          }

          showStatus(
            'The image could not be uploaded. Please try again.',
            'error'
          );

          return;
        }

        const {
          data: urlData
        } = supabaseClient.storage
          .from('skill-images')
          .getPublicUrl(
            uploadedFilePath
          );

        publicImageUrl =
          urlData?.publicUrl || null;
      }

      const digitsOnly =
        validation.data.phone.replace(
          /\D/g,
          ''
        );

      /*
        Database insert.
      */
      const { error: insertError } =
        await supabaseClient
          .from('skills')
          .insert({
            name: validation.data.name,
            meta: validation.data.meta,
            category: validation.data.category,
            title: validation.data.title,
            description: validation.data.description,
            price: validation.data.price,
            phone: digitsOnly,
            user_id: currentUser.id,
            image_url: publicImageUrl
          });

      if (insertError) {
        console.error(
          'Skill insert failed:',
          insertError
        );

        /*
          If the database insert fails after the image upload,
          remove the orphaned image.
        */
        if (uploadedFilePath) {
          try {
            await supabaseClient.storage
              .from('skill-images')
              .remove([
                uploadedFilePath
              ]);
          } catch (cleanupError) {
            console.warn(
              'Image cleanup failed:',
              cleanupError
            );
          }
        }

        if (isAuthError(insertError)) {
          await safelyClearSession();

          showStatus(
            'Your session expired. Please sign in again.',
            'error'
          );

          closePostModal();
          openAuthModal();

          return;
        }

        showStatus(
          'We could not publish your listing. Please check the form and try again.',
          'error'
        );

        return;
      }

      closePostModal();

      showStatus(
        'Your skill has been published!',
        'success'
      );

      await renderGrid();

    } catch (error) {
      console.error(
        'Unexpected skill submission error:',
        error
      );

      /*
        Cleanup orphaned image if something unexpected
        happened after upload.
      */
      if (uploadedFilePath) {
        try {
          await supabaseClient.storage
            .from('skill-images')
            .remove([
              uploadedFilePath
            ]);
        } catch (cleanupError) {
          console.warn(
            'Unexpected cleanup failure:',
            cleanupError
          );
        }
      }

      showStatus(
        'Something went wrong while publishing. Please try again.',
        'error'
      );

    } finally {
      setButtonLoading(
        submitButton,
        false,
        'Publishing...',
        'Publish Skill Listing'
      );
    }
  }

  /* =========================================================
     CATEGORY FILTER
     ========================================================= */

  function filterCategory(cat, btn) {
    currentFilter = cat;

    document
      .querySelectorAll('.filter-btn')
      .forEach(button => {
        button.classList.remove('active');
      });

    btn?.classList.add('active');

    renderGrid();
  }

  /* =========================================================
     CONTACT / PHONE
     ========================================================= */

  async function openContactModal(skillId, name) {
    const modalName =
      $('modalName');

    const whatsappLink =
      $('whatsappLink');

    if (!modalName || !whatsappLink) {
      return;
    }

    modalName.innerText =
      `Connect with ${name || 'Creator'}`;

    whatsappLink.innerText =
      'Securing phone number...';

    whatsappLink.removeAttribute('href');

    whatsappLink.style.pointerEvents =
      'none';

    $('contactModal')?.classList.add(
      'active'
    );

    try {
      const {
        data,
        error
      } = await supabaseClient.rpc(
        'get_skill_phone',
        {
          skill_id: skillId
        }
      );

      if (error) {
        console.error(
          'Phone RPC failed:',
          error
        );

        if (isAuthError(error)) {
          await safelyClearSession();
        }

        whatsappLink.innerText =
          'Contact temporarily unavailable';

        return;
      }

      const row =
        Array.isArray(data)
          ? data[0]
          : data;

      const rawPhone =
        row?.phone || '';

      const cleanPhone =
        String(rawPhone)
          .replace(/\D/g, '');

      if (
        !cleanPhone ||
        cleanPhone.length < 7
      ) {
        whatsappLink.innerText =
          'Phone number unavailable';

        return;
      }

      whatsappLink.href =
        `https://wa.me/${cleanPhone}`;

      whatsappLink.target =
        '_blank';

      whatsappLink.rel =
        'noopener noreferrer';

      whatsappLink.innerText =
        'Open in WhatsApp';

      whatsappLink.style.pointerEvents =
        'auto';

    } catch (error) {
      console.error(
        'Unexpected contact error:',
        error
      );

      whatsappLink.innerText =
        'Contact temporarily unavailable';
    }
  }

  function closeContactModal() {
    $('contactModal')?.classList.remove(
      'active'
    );
  }

  /* =========================================================
     MODAL CLICK-OUTSIDE SUPPORT
     ========================================================= */

  document.addEventListener(
    'click',
    event => {
      const modals = [
        'authModal',
        'postModal',
        'contactModal'
      ];

      modals.forEach(id => {
        const modal = $(id);

        if (
          modal &&
          event.target === modal
        ) {
          modal.classList.remove(
            'active'
          );
        }
      });
    }
  );

  /* =========================================================
     ESCAPE KEY
     ========================================================= */

  document.addEventListener(
    'keydown',
    event => {
      if (event.key !== 'Escape') return;

      [
        'authModal',
        'postModal',
        'contactModal'
      ].forEach(id => {
        $(id)?.classList.remove(
          'active'
        );
      });
    }
  );

  /* =========================================================
     AUTH URL CLEANUP
     ========================================================= */

  /*
    Supabase automatically initializes the session and detects
    the magic-link callback when detectSessionInUrl is enabled.
    Once the session has been processed, clean auth query/hash
    fragments from the visible URL.
  */
  function cleanAuthUrl() {
    try {
      const url =
        new URL(window.location.href);

      const hasAuthParams =
        url.searchParams.has('code') ||
        url.searchParams.has('token_hash') ||
        url.hash.includes('access_token') ||
        url.hash.includes('refresh_token');

      if (!hasAuthParams) return;

      window.history.replaceState(
        {},
        document.title,
        APP_URL
      );
    } catch (error) {
      console.warn(
        'Could not clean auth URL:',
        error
      );
    }
  }

  /* =========================================================
     STARTUP
     ========================================================= */

  async function initializeApp() {
    await refreshSessionSafely();

    updateAuthUI();

    /*
      Give Supabase a moment to finish processing a
      magic-link callback before rendering.
    */
    setTimeout(() => {
      cleanAuthUrl();
      renderGrid();
    }, 250);
  }

  initializeApp();
</script>
